name: Markdown Lint

on:
  push:
    paths:
      - '**.md'
  pull_request:
    paths:
      - '**.md'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Verificar arquivos Markdown
        run: markdownlint '**/*.md'
